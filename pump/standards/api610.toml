[editions."11".vibration]
oh_bb_overall = "3.0 mm/s"
oh_bb_filtered = "2.0 mm/s"
vs_overall = "5.0 mm/s"
vs_filtered = "3.4 mm/s"
outside_por_increase = 0.30
source = "API 610 11th ed. Table 8 (OH and BB, bearing housing): overall 3.0 mm/s RMS, discrete 2.0 mm/s RMS for pumps up to 3600 r/min and 300 kW per stage; Table 9 (VS): overall 5.0, discrete 3.4 mm/s RMS; +30 % outside the preferred operating region; RMS only (6.9.3.4). Locations: Figures 31-33. High-speed pumps (above 3600 r/min or 300 kW per stage): Figure 34 allowance applied from [vibration.high_speed] (exponents reconstructed, unverified)."
verified = false

[editions."11".vibration.high_speed]
# Figure 34: horizontal (Table 8: OH, BB) pumps above 3600 r/min or 300 kW per stage.
base = "3.0 mm/s"
cap = "4.5 mm/s"
n_ref = "3600 rpm"
p_ref = "300 kW"
speed_exponent = 0.30
power_exponent = 0.21
discrete_ratio = 0.67
source = "API 610 11th ed. Figure 34: v_u = 3.0 (n/3600)^0.30 (P/300)^0.21 mm/s RMS, limited to 4.5 mm/s; P = power at BEP of the rated impeller, relative density 1.0, per stage (P <= 300 kW uses 300; the result is kept between 3.0 and 4.5 mm/s: the figure's 'transition from 3.0 to 4.5 mm/s'; rounded to two significant figures); discrete frequencies v_f < 0.67 v_u (Note 2). The exponents are illegible in the local text conversion: 0.30 and 0.21 are reconstructed and cross-checked against the figure's curve positions (P >= 3000 kW reaches 4.5 mm/s near 2 800 r/min, P <= 300 kW near 13 900 r/min). Confirm against the printed figure."
verified = false

[editions."11".selection]
por_min = 0.70
por_max = 1.20
source = "API 610 11th ed. 6.1.12: preferred operating region 70-120 % of BEP flow; rated flow within 80-110 %."
