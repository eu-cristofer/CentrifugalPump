# API 610 / ISO 13709 acceptance criteria, one table per edition.
#
# Values are seeds or secondary-source values (see each `source`): editions 10/11
# were researched 2026-11-15 (Amarinth bulletin MP2606-100); the 8th edition is
# inferred from the 10th. No edition has been checked against the standard text,
# so every edition carries verified = false.  Do not flip a flag to true without a
# clause-level source.
#
# The [editions."N".npsh] tables are NOT-CONFIGURED placeholders: min_ratio and
# min_margin are deliberately omitted so no NPSH margin verdict is ever issued
# from an invented number.  Enter the client/API margin rule to activate it.

standard = "api610"
title = "API 610 / ISO 13709"

[editions."8"]
label = "API 610 8th edition"
source = "INFERRED from the 10th edition (Amarinth technical bulletin MP2606-100 rev A (Dec-11), 'Testing procedures API 610 10th and 11th'): head 0-150 m +5/-2 %, 151-300 m +3/-2 %, >300 m +/-2 % (the 8th ed. is believed to state the same bands in ft: 0-500 / 500-1000 / >1000 ft); shut-off/power/efficiency: seeds. 8th-edition text NOT consulted."
verified = false
power_tol_plus = 0.04
efficiency_tol_minus = 0.03
parallel_shutoff_min_ratio = 1.10
shutoff_extrapolation_q_fraction = 0.05
head_bands = [
  { max_rated_head = "150 m", tol_minus = 0.02, tol_plus = 0.05 },
  { max_rated_head = "300 m", tol_minus = 0.02, tol_plus = 0.03 },
  { max_rated_head = "inf m", tol_minus = 0.02, tol_plus = 0.02 },
]
shutoff_bands = [
  { max_rated_head = "75 m", tol_minus = 0.10, tol_plus = 0.10 },
  { max_rated_head = "300 m", tol_minus = 0.08, tol_plus = 0.08 },
  { max_rated_head = "inf m", tol_minus = 0.05, tol_plus = 0.05 },
]

[editions."8".mechanical_run]
min_duration = "4 h"
source = "8th edition not consulted; values taken from the 10th/11th editions — duration 4 h at rated flow and oil-temperature stabilisation: Amarinth technical bulletin MP2606-100 rev A (Dec-11), 'Testing procedures API 610 10th and 11th'; vibration (horizontal pumps, mm/s RMS, preferred region): overall 3.0 / discrete 2.0 (allowable region 3.9 / 2.6), same source, 10th and 11th editions. Caveats: limits are RMS (check whether the test sheet reports peak); API 610 speed/power adjustments for pumps above 3600 rpm or 300 kW per stage NOT applied."
verified = false

[[editions."8".mechanical_run.roles]]
role = "vibration_filtered"
max = "2.0 mm/s"

[[editions."8".mechanical_run.roles]]
role = "vibration_unfiltered"
max = "3.0 mm/s"

[editions."8".npsh]
source = "not configured — enter the client/API margin rule"
verified = false

