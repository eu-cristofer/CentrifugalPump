name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Qt offscreen system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]"

      - name: Tests (tests/ + pump/ doctests)
        run: pytest

      - name: Black (black-clean file set)
        run: >
          black --check
          pump/acceptance.py
          pump/compare.py
          pump/mechanical_run.py
          pump/npsh.py
          pump/viscosity.py
          pump/trim.py
          pump/fitting.py
          pump/system_curve.py
          pump/operating_point.py
          pump/catalogue.py
          pump/constants.py
          pump/quantity_io.py
          pump/utilities/pressure.py
          pumpflow/binding/
          pumpflow/signals.py
          pumpflow/settings_codec.py
          pumpflow/export_cli.py
          tests/test_acceptance.py
          tests/test_acceptance_binding.py
          tests/test_compare.py
          tests/test_compliance_gui.py
          tests/test_explain.py
          tests/test_head_components.py
          tests/test_head_gui.py
          tests/test_mechanical_run.py
          tests/test_mechanical_run_gui.py
          tests/test_notebooks.py
          tests/test_npsh.py
          tests/test_npsh_gui.py
          tests/test_operating_point.py
          tests/test_quantity_spine.py
          tests/test_schema_migration.py
          tests/test_selection.py
          tests/test_selection_gui.py
          tests/test_signals_quantities.py
          tests/test_system_curve.py
          tests/test_system_curve_gui.py
          tests/test_trim.py
          tests/test_trim_gui.py
          tests/test_units.py
          tests/test_units_gui.py
          tests/test_viscosity.py

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: mypy
        run: mypy pump --ignore-missing-imports

  latex-pdf:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries (Qt offscreen + LaTeX)
        run: >
          sudo apt-get update && sudo apt-get install -y
          libegl1 libxkbcommon0 libgl1
          texlive-latex-base texlive-latex-recommended texlive-latex-extra
          texlive-fonts-recommended texlive-lang-portuguese latexmk
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]"
      - name: Export the B-34004A PDF report
        run: python -m pumpflow.export_cli examples/user/B-34004A_MRT_reference.pumpflow --formats pdf --out out
      - uses: actions/upload-artifact@v4
        with:
          name: b34004a-report
          path: out/

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Sphinx (warnings are errors)
        run: sphinx-build -b html docs docs/_build/html -W
